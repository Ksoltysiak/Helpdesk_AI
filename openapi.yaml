openapi: 3.0.3

info:
  title: Inteligentny HelpDesk IT — API
  version: "1.0.0"
  description: |
    REST API systemu zgłoszeń IT z kontrolą dostępu opartą na rolach (RBAC),
    automatyczną kategoryzacją AI i pełną ścieżką audytu.

    ## Uwierzytelnianie

    Wszystkie punkty końcowe poza `POST /auth/login` wymagają tokenu JWT
    w nagłówku:

    ```
    Authorization: Bearer <token>
    ```

    Token zwraca operacja logowania. Jest ważny **8 godzin**.

    ## Role i uprawnienia

    | Rola | Uprawnienia |
    |---|---|
    | `pracownik` | Tworzy zgłoszenia, widzi **wyłącznie własne** |
    | `technik` | Widzi wszystkie, zmienia status/kategorię, dodaje notatki, czyta audyt |
    | `admin` | Pełny dostęp |

    Odpowiedzi dla pracownika są filtrowane po stronie serwera — nie jest to
    ukrywanie danych w interfejsie, lecz twarda granica dostępu.

    ## Kody błędów

    | Kod | Znaczenie |
    |---|---|
    | 400 | Nieprawidłowe dane wejściowe lub niedozwolone przejście statusu |
    | 401 | Brak tokenu, token wygasły lub nieprawidłowy |
    | 403 | Token poprawny, ale rola nie pozwala na tę operację |
    | 404 | Zasób nie istnieje |
    | 409 | Zgłoszenie zmieniono w międzyczasie — należy je odświeżyć |
    | 413 | Ciało żądania przekracza 64 KB |
    | 429 | Przekroczony limit prób logowania |

    ## Znaczniki czasu

    Wszystkie daty są w UTC, w formacie ISO 8601 z oznaczeniem strefy
    (`2026-07-25T11:40:00Z`). Przeliczenie na czas lokalny należy do klienta.

servers:
  - url: /api
    description: Ten sam serwer, który serwuje interfejs użytkownika

tags:
  - name: Uwierzytelnianie
    description: Logowanie i odtwarzanie sesji
  - name: Zgłoszenia
    description: Cykl życia zgłoszenia IT
  - name: Klienci
    description: Firmy obsługiwane przez helpdesk
  - name: Raporty
    description: Zestawienia zgłoszeń dla klientów
  - name: Notatki i audyt
    description: Notatki techników i historia zmian
  - name: Pulpit i AI
    description: Statystyki oraz moduł kategoryzacji

security:
  - bearerAuth: []

paths:

  # ---------------------------------------------------------------
  /health:
    get:
      tags: [Pulpit i AI]
      summary: Kontrola zdrowia usługi
      description: |
        Przeznaczone dla load balancera i monitoringu — **nie wymaga tokenu**,
        ponieważ sonda infrastruktury go nie posiada. Nie jest objęte limitem
        żądań.

        Odpowiedź nie zawiera żadnych szczegółów o systemie: potwierdza jedynie,
        że proces odpowiada i ma działające połączenie z bazą danych.
      security: []
      responses:
        "200":
          description: Usługa działa poprawnie
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok], example: ok }
        "503":
          description: Brak połączenia z bazą danych
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [error], example: error }

  # ---------------------------------------------------------------
  /auth/login:
    post:
      tags: [Uwierzytelnianie]
      summary: Logowanie
      description: |
        Zwraca token JWT ważny 8 godzin.

        Obowiązują **dwa limity jednocześnie**:

        - **10/min i 30/h na adres IP** — ogranicza masowe próby z jednego źródła,
        - **5/min i 20/h na konto** (adres IP + nazwa użytkownika) — ogranicza
          zgadywanie hasła do konkretnego konta także z wielu adresów.

        Po przekroczeniu któregokolwiek zwracany jest kod 429. Świadomie **nie**
        stosujemy blokady konta po N próbach — napastnik mógłby wtedy celowo
        odciąć dostęp prawdziwym użytkownikom.

        Komunikat błędu jest celowo identyczny dla nieprawidłowego hasła
        i nieistniejącego użytkownika — nie ujawnia, które konta istnieją.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  example: m.lewandowski
                password:
                  type: string
                  format: password
                  example: tech123
      responses:
        "200":
          description: Zalogowano
          content:
            application/json:
              schema:
                type: object
                required: [id, name, role, client_id, client_name, token]
                properties:
                  id: { type: integer, example: 4 }
                  name: { type: string, example: Marek Lewandowski }
                  role: { $ref: "#/components/schemas/Rola" }
                  client_id:
                    type: integer
                    nullable: true
                    description: Firma zalogowanej osoby; `null` dla technika i administratora
                    example: 1
                  client_name:
                    type: string
                    nullable: true
                    example: Piekarnia Złoty Kłos
                  token:
                    type: string
                    description: Token JWT do nagłówka Authorization
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        "401":
          $ref: "#/components/responses/BledneDaneLogowania"
        "413":
          $ref: "#/components/responses/ZaDuzeZadanie"
        "429":
          $ref: "#/components/responses/ZaWieleZadan"

  # ---------------------------------------------------------------
  /auth/me:
    get:
      tags: [Uwierzytelnianie]
      summary: Dane zalogowanego użytkownika
      description: |
        Służy do odtworzenia sesji po odświeżeniu strony: interfejs
        przechowuje token i weryfikuje go tutaj, zamiast ufać danym
        zapisanym w przeglądarce.
      responses:
        "200":
          description: Dane użytkownika przypisanego do tokenu
          content:
            application/json:
              schema:
                type: object
                required: [id, name, role, client_id, client_name]
                properties:
                  id: { type: integer, example: 1 }
                  name: { type: string, example: Katarzyna Nowak }
                  role: { $ref: "#/components/schemas/Rola" }
                  client_id:
                    type: integer
                    nullable: true
                    description: Firma zalogowanej osoby; `null` dla technika i administratora
                    example: 1
                  client_name:
                    type: string
                    nullable: true
                    example: Piekarnia Złoty Kłos
        "401":
          $ref: "#/components/responses/BrakAutoryzacji"

  # ---------------------------------------------------------------
  /dashboard:
    get:
      tags: [Pulpit i AI]
      summary: Dane pulpitu — statystyki, SLA, trend i aktywność
      description: |
        **Zakres zależy od roli**, tak samo jak lista zgłoszeń:

        - **pracownik** — statystyki wyłącznie jego własnych zgłoszeń,
        - **technik / admin** — dane zbiorcze całego systemu.

        Dzięki temu pulpit pokazuje to samo, co widoczna dla użytkownika lista,
        a pracownik nie poznaje liczby zgłoszeń w całej organizacji.
      responses:
        "200":
          description: Statystyki
          content:
            application/json:
              schema:
                type: object
                required: [statystyki, wg_kategorii]
                properties:
                  statystyki:
                    type: object
                    required: [wszystkie, otwarte, w_trakcie, rozwiazane, zamkniete, krytyczne]
                    properties:
                      wszystkie:
                        type: integer
                        description: Łączna liczba zgłoszeń w zakresie roli
                        example: 18
                      otwarte:
                        type: integer
                        description: Wszystkie zgłoszenia poza zamkniętymi
                        example: 15
                      w_trakcie: { type: integer, example: 5 }
                      rozwiazane: { type: integer, example: 2 }
                      zamkniete: { type: integer, example: 3 }
                      krytyczne:
                        type: integer
                        description: Priorytet krytyczny, jeszcze niezamknięte
                        example: 3
                  wg_kategorii:
                    type: array
                    description: Rozkład zgłoszeń wg kategorii, malejąco
                    items:
                      type: object
                      required: [kategoria, liczba]
                      properties:
                        kategoria: { $ref: "#/components/schemas/Kategoria" }
                        liczba: { type: integer, example: 4 }
                  aktywnosc:
                    type: array
                    description: |
                      Najnowsze wpisy ścieżki audytu (do 12), od najświeższego.
                      Pracownik widzi tylko utworzenie i zmiany statusu własnych zgłoszeń.
                    items:
                      type: object
                      required: [ticket_id, title, action, old, new, user, timestamp]
                      properties:
                        ticket_id: { type: integer, example: 12 }
                        title: { type: string, example: Nie dziala VPN }
                        action: { type: string, example: Zmiana statusu }
                        old: { type: string, nullable: true, example: Nowe }
                        new: { type: string, nullable: true, example: W trakcie }
                        user: { type: string, example: Marek Lewandowski }
                        timestamp: { type: string, format: date-time }
                  puls:
                    type: object
                    description: Tylko technik/admin — stan kolejki „teraz"
                    properties:
                      po_terminie: { type: integer, description: Aktywne po terminie SLA, example: 3 }
                      zagrozone: { type: integer, description: Termin SLA w ciągu 2 h, example: 1 }
                      nieprzypisane: { type: integer, example: 4 }
                      moje: { type: integer, description: Aktywne przypisane do zalogowanego, example: 2 }
                      dzis_nowe: { type: integer, example: 6 }
                      dzis_zamkniete: { type: integer, example: 3 }
                  trend:
                    type: array
                    description: Tylko technik/admin — nowe i zamknięte w ostatnich 14 dniach (UTC), także dni bez ruchu
                    items:
                      type: object
                      properties:
                        data: { type: string, format: date }
                        nowe: { type: integer }
                        zamkniete: { type: integer }
                  wg_priorytetu:
                    type: object
                    description: Tylko technik/admin — aktywne zgłoszenia wg priorytetu
                    additionalProperties: { type: integer }
                    example: { Krytyczny: 1, Wysoki: 4, Sredni: 6, Niski: 2 }
                  pilne_sla:
                    type: array
                    description: Tylko technik/admin — do 6 aktywnych zgłoszeń najbliżej terminu SLA lub po nim
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        title: { type: string }
                        priority: { $ref: "#/components/schemas/Priorytet" }
                        status: { $ref: "#/components/schemas/Status" }
                        sla_deadline: { type: string, format: date-time }
                        assigned_to_name: { type: string, nullable: true }
                  obciazenie:
                    type: array
                    description: Tylko technik/admin — aktywne zgłoszenia na osobę z personelu
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        name: { type: string }
                        aktywne: { type: integer }
                        krytyczne: { type: integer }
        "401":
          $ref: "#/components/responses/BrakAutoryzacji"

  # ---------------------------------------------------------------
  /tickets:
    get:
      tags: [Zgłoszenia]
      summary: Lista zgłoszeń
      description: |
        Zakres wyników zależy od roli:

        - **pracownik** — wyłącznie zgłoszenia, których jest autorem;
          parametry filtrowania (poza `aktywne`) są dla niego ignorowane
          i **nie pozwalają** dosięgnąć cudzych zgłoszeń,
        - **technik / admin** — wszystkie zgłoszenia, z opcjonalnym filtrowaniem.

        **Wyniki są stronicowane.** Domyślnie zwracane jest 50 zgłoszeń na
        stronę, maksymalnie 200. Pole `total` oznacza liczbę **wszystkich**
        pasujących zgłoszeń, a nie liczbę zwróconych w tej odpowiedzi.

        Wartości spoza zakresu są przycinane do dozwolonych granic zamiast
        powodować błąd (np. `per_page=9999` zadziała jak `per_page=200`).
      parameters:
        - name: status
          in: query
          description: Tylko technik/admin
          schema: { $ref: "#/components/schemas/Status" }
        - name: priority
          in: query
          description: Tylko technik/admin
          schema: { $ref: "#/components/schemas/Priorytet" }
        - name: category
          in: query
          description: Tylko technik/admin
          schema: { $ref: "#/components/schemas/Kategoria" }
        - name: client_id
          in: query
          description: Tylko technik/admin — zgłoszenia jednego klienta
          schema: { type: integer, example: 2 }
        - name: przypisane
          in: query
          description: |
            Tylko technik/admin. `ja` — przypisane do zalogowanego,
            `brak` — bez opiekuna. Inna wartość jest pomijana.
          schema: { type: string, enum: [ja, brak] }
        - name: sla
          in: query
          description: Tylko technik/admin. `przekroczone` — aktywne zgłoszenia po terminie SLA
          schema: { type: string, enum: [przekroczone] }
        - name: aktywne
          in: query
          description: |
            `1` — tylko zgłoszenia w obsłudze (bez rozwiązanych i zamkniętych).
            Działa dla każdej roli — zawęża listę, więc nie narusza izolacji pracownika.
          schema: { type: string, enum: ["1"] }
        - name: page
          in: query
          description: Numer strony, liczony od 1
          schema: { type: integer, minimum: 1, default: 1 }
        - name: per_page
          in: query
          description: Liczba zgłoszeń na stronę
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: Stronicowana lista zgłoszeń
          content:
            application/json:
              schema:
                type: object
                required: [total, page, per_page, pages, tickets]
                properties:
                  total:
                    type: integer
                    description: Liczba wszystkich pasujących zgłoszeń
                    example: 1284
                  page:
                    type: integer
                    description: Numer zwróconej strony
                    example: 1
                  per_page:
                    type: integer
                    description: Liczba zgłoszeń na stronę
                    example: 50
                  pages:
                    type: integer
                    description: Łączna liczba stron (minimum 1)
                    example: 26
                  tickets:
                    type: array
                    items: { $ref: "#/components/schemas/Zgloszenie" }
        "401":
          $ref: "#/components/responses/BrakAutoryzacji"

    post:
      tags: [Zgłoszenia]
      summary: Nowe zgłoszenie
      description: |
        Dostępne **wyłącznie dla roli `pracownik`** — technik zgłoszenia
        obsługuje, a nie składa.

        Po zapisaniu moduł AI nadaje kategorię i priorytet, a na podstawie
        priorytetu wyliczany jest termin SLA. Obie czynności trafiają do
        ścieżki audytu.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, description]
              properties:
                title:
                  type: string
                  maxLength: 200
                  example: Nie dziala VPN na moim laptopie
                description:
                  type: string
                  maxLength: 5000
                  example: Od rana nie moge polaczyc sie z firmowym VPN. Blad TLS handshake.
      responses:
        "201":
          description: Zgłoszenie utworzone
          content:
            application/json:
              schema:
                type: object
                required: [id, kategoryzacja_ai, sla_deadline]
                properties:
                  id: { type: integer, example: 20 }
                  kategoryzacja_ai: { $ref: "#/components/schemas/WynikAI" }
                  sla_deadline:
                    type: string
                    format: date-time
                    example: "2026-08-01T15:30:00Z"
        "400":
          $ref: "#/components/responses/BledneDane"
        "401":
          $ref: "#/components/responses/BrakAutoryzacji"
        "403":
          $ref: "#/components/responses/BrakUprawnien"
        "413":
          $ref: "#/components/responses/ZaDuzeZadanie"

  # ---------------------------------------------------------------
  /tickets/{ticket_id}:
    parameters:
      - $ref: "#/components/parameters/TicketId"

    get:
      tags: [Zgłoszenia]
      summary: Szczegóły zgłoszenia wraz z notatkami
      description: |
        Pracownik może odczytać **wyłącznie własne** zgłoszenie — próba
        odczytu cudzego kończy się kodem 403.

        Lista notatek również zależy od roli: pracownik widzi tylko notatki
        jawne (`internal: false`), technik i admin widzą wszystkie.
      responses:
        "200":
          description: Szczegóły zgłoszenia
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Zgloszenie"
                  - type: object
                    required: [notes]
                    properties:
                      notes:
                        type: array
                        items: { $ref: "#/components/schemas/Notatka" }
        "401":
          $ref: "#/components/responses/BrakAutoryzacji"
        "403":
          $ref: "#/components/responses/BrakDostepuDoZgloszenia"
        "404":
          $ref: "#/components/responses/NieZnaleziono"

    patch:
      tags: [Zgłoszenia]
      summary: Zmiana statusu, kategorii lub przypisania
      description: |
        Wymaga roli `technik` lub `admin`. Należy podać co najmniej jedno
        z pól — pusty obiekt kończy się kodem 400.

        **Zmiana statusu podlega maszynie stanów.** Dozwolone przejścia:

        ```
        Nowe → W trakcie → Rozwiazane → Zamkniete
                      ↘ Wstrzymane ↗
        ```

        Próba przeskoczenia etapu (np. `Nowe → Zamkniete`) kończy się kodem
        400 i listą dozwolonych przejść w polu `dozwolone`.

        Efekty uboczne: podjęcie zgłoszenia ze statusu `Nowe` przypisuje je
        do wywołującego, jeśli nie miało jeszcze opiekuna; przejście do
        `Zamkniete` ustawia `closed_at`.

        Zmiana jest atomowa: błąd w dowolnym polu kończy się kodem 400 bez
        zapisania pozostałych. Jeśli status zgłoszenia zmienił ktoś inny
        między odczytem a zapisem (np. dwóch techników podejmuje je
        jednocześnie), odpowiedzią jest 409 — należy odświeżyć zgłoszenie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                status: { $ref: "#/components/schemas/Status" }
                category: { $ref: "#/components/schemas/Kategoria" }
                assigned_to:
                  type: integer
                  description: |
                    Identyfikator istniejącego użytkownika z rolą `technik`
                    lub `admin` — inny identyfikator kończy się kodem 400.
                  example: 5
            examples:
              podjecie:
                summary: Podjęcie zgłoszenia
                value: { status: "W trakcie" }
              korekta:
                summary: Ręczna korekta kategoryzacji AI
                value: { category: "Bezpieczenstwo" }
      responses:
        "200":
          description: Zaktualizowano
          content:
            application/json:
              schema:
                type: object
                required: [id, zaktualizowano]
                properties:
                  id: { type: integer, example: 12 }
                  zaktualizowano:
                    type: array
                    description: Nazwy pól, które faktycznie zmieniono
                    items:
                      type: string
                      enum: [status, category, assigned_to]
                    example: [status]
        "400":
          description: Niedozwolone przejście statusu lub nieprawidłowe dane
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string }
                  dozwolone:
                    type: array
                    description: Obecny w odpowiedzi przy niedozwolonym przejściu statusu
                    items: { $ref: "#/components/schemas/Status" }
              example:
                error: "Niedozwolona zmiana statusu: Nowe -> Zamkniete"
                dozwolone: ["W trakcie"]
        "401":
          $ref: "#/components/responses/BrakAutoryzacji"
        "403":
          $ref: "#/components/responses/BrakUprawnien"
        "404":
          $ref: "#/components/responses/NieZnaleziono"
        "409":
          description: Status zgłoszenia zmieniono w międzyczasie
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Blad" }
              example:
                error: "Zgloszenie zostalo zmienione w miedzyczasie — odswiez je i sprobuj ponownie"
        "413":
          $ref: "#/components/responses/ZaDuzeZadanie"

  # ---------------------------------------------------------------
  /tickets/{ticket_id}/notes:
    parameters:
      - $ref: "#/components/parameters/TicketId"

    post:
      tags: [Notatki i audyt]
      summary: Dodanie notatki
      description: |
        Wymaga roli `technik` lub `admin`.

        Notatka domyślnie jest **wewnętrzna** (`internal: true`) — niewidoczna
        dla zgłaszającego. Aby udostępnić ją pracownikowi, należy jawnie
        przekazać `internal: false`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                  maxLength: 2000
                  example: Certyfikat VPN wygasl. Odnawiam.
                internal:
                  type: boolean
                  default: true
                  description: "true = widoczna tylko dla techników"
      responses:
        "201":
          description: Notatka zapisana
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
        "400":
          $ref: "#/components/responses/BledneDane"
        "401":
          $ref: "#/components/responses/BrakAutoryzacji"
        "403":
          $ref: "#/components/responses/BrakUprawnien"
        "404":
          $ref: "#/components/responses/NieZnaleziono"
        "413":
          $ref: "#/components/responses/ZaDuzeZadanie"

  # ---------------------------------------------------------------
  /tickets/{ticket_id}/audit:
    parameters:
      - $ref: "#/components/parameters/TicketId"

    get:
      tags: [Notatki i audyt]
      summary: Ścieżka audytu zgłoszenia
      description: |
        Pełna historia zmian w porządku chronologicznym: utworzenie,
        kategoryzacja AI, zmiany statusu i kategorii, przypisania, notatki.

        Wymaga roli `technik` lub `admin`. Wpisy wykonane automatycznie
        (kategoryzacja AI) mają w polu `user` wartość `System AI`.
      responses:
        "200":
          description: Lista wpisów audytu
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WpisAudytu" }
        "401":
          $ref: "#/components/responses/BrakAutoryzacji"
        "403":
          $ref: "#/components/responses/BrakUprawnien"
        "404":
          $ref: "#/components/responses/NieZnaleziono"

  # ---------------------------------------------------------------
  /clients:
    get:
      tags: [Klienci]
      summary: Lista klientów
      description: |
        Firmy obsługiwane przez helpdesk wraz z liczbą pracowników oraz
        wszystkich i otwartych zgłoszeń, posortowane alfabetycznie.

        Wymaga roli `technik` lub `admin` — pracownik jednej firmy nie poznaje
        nazw ani skali zgłoszeń innych klientów.
      responses:
        "200":
          description: Lista klientów
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Klient" }
        "401":
          $ref: "#/components/responses/BrakAutoryzacji"
        "403":
          $ref: "#/components/responses/BrakUprawnien"

  # ---------------------------------------------------------------
  /reports:
    get:
      tags: [Raporty]
      summary: Raport zgłoszeń klienta za wybrany okres
      description: |
        Zestawienie dla klienta (albo wszystkich klientów, gdy pominięto
        `client_id`): co psuło się najczęściej, jak szybko i czy w terminie
        SLA rozwiązywano zgłoszenia oraz jak zmieniło się to względem
        poprzedniego okresu tej samej długości.

        **Okres:** daty `od` i `do` w formacie `RRRR-MM-DD`, obie włącznie,
        liczone jako pełne doby UTC. Domyślnie ostatnie 30 dni; sama data
        `od` oznacza „od tego dnia do dziś", sama data `do` — 30 dni
        kończących się tego dnia. Najwyżej 366 dni.

        **Definicje:**

        - *rozwiązane* — status `Rozwiazane` lub `Zamkniete`;
        - *czas rozwiązania* — od utworzenia do **ostatniego** przejścia do
          statusu `Rozwiazane` (zgłoszenie otwarte ponownie liczy się od
          drugiego rozwiązania); gdy w historii brak takiego wpisu — do
          zamknięcia;
        - *w terminie SLA* — rozwiązane przed upływem `sla_deadline`;
        - *najczęstsze problemy* — słowa kluczowe, na podstawie których moduł
          AI ocenił zgłoszenia (np. `vpn`, `drukark`).

        Rekomendacje są regułowe — każda wynika z konkretnej liczby
        w raporcie. Jest ich najwyżej pięć, od najważniejszych
        (bezpieczeństwo, terminy SLA) do statystycznych. Wymaga roli
        `technik` lub `admin`.
      parameters:
        - name: client_id
          in: query
          description: Klient; pominięty — raport zbiorczy wszystkich klientów
          schema: { type: integer, minimum: 1, example: 2 }
        - name: od
          in: query
          description: Pierwszy dzień okresu (włącznie)
          schema: { type: string, format: date, example: "2026-09-01" }
        - name: do
          in: query
          description: Ostatni dzień okresu (włącznie)
          schema: { type: string, format: date, example: "2026-09-30" }
      responses:
        "200":
          description: Raport
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Raport" }
        "400":
          description: Nieprawidłowy okres lub identyfikator klienta
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Blad" }
              example: { error: "Okres raportu moze miec najwyzej 366 dni" }
        "401":
          $ref: "#/components/responses/BrakAutoryzacji"
        "403":
          $ref: "#/components/responses/BrakUprawnien"
        "404":
          description: Klient o podanym identyfikatorze nie istnieje
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Blad" }
              example: { error: "Nie znaleziono klienta" }

  # ---------------------------------------------------------------
  /ai/skutecznosc:
    get:
      tags: [Pulpit i AI]
      summary: Skuteczność kategoryzacji AI
      description: |
        Miara jakości modułu liczona z **rzeczywistej pracy techników**, a nie
        deklarowana. Każda ręczna zmiana kategorii to sygnał, że moduł pomylił
        się na konkretnym zgłoszeniu — skuteczność to odsetek zgłoszeń,
        których nie trzeba było poprawiać.

        Zestawienie pokazuje też najczęstsze pomyłki (z jakiej kategorii na
        jaką poprawiano), co wprost wskazuje, które słowa kluczowe wymagają
        uzupełnienia.

        Wymaga roli `technik` lub `admin`.
      responses:
        "200":
          description: Zestawienie skuteczności
          content:
            application/json:
              schema:
                type: object
                required:
                  - zgloszen_z_ai
                  - poprawionych_recznie
                  - skutecznosc
                  - srednia_pewnosc
                  - wymaga_weryfikacji
                  - prog_pewnosci
                  - najczestsze_pomylki
                properties:
                  zgloszen_z_ai:
                    type: integer
                    description: Liczba zgłoszeń skategoryzowanych automatycznie
                    example: 318
                  poprawionych_recznie:
                    type: integer
                    description: Ile z nich technik przekwalifikował
                    example: 24
                  skutecznosc:
                    type: number
                    format: float
                    nullable: true
                    description: "1 − (poprawione / wszystkie); `null`, gdy brak danych"
                    example: 0.925
                  srednia_pewnosc:
                    type: number
                    format: float
                    nullable: true
                    example: 0.68
                  wymaga_weryfikacji:
                    type: integer
                    description: Zgłoszenia o pewności poniżej progu
                    example: 12
                  prog_pewnosci:
                    type: number
                    format: float
                    example: 0.4
                  najczestsze_pomylki:
                    type: array
                    description: Kierunki najczęstszych ręcznych korekt
                    items:
                      type: object
                      properties:
                        z:      { type: string, example: Oprogramowanie }
                        na:     { type: string, example: Konta i dostep }
                        liczba: { type: integer, example: 7 }
        "401":
          $ref: "#/components/responses/BrakAutoryzacji"
        "403":
          $ref: "#/components/responses/BrakUprawnien"

  # ---------------------------------------------------------------
  /ai/categorize:
    post:
      tags: [Pulpit i AI]
      summary: Testowe uruchomienie kategoryzacji
      description: |
        Zwraca wynik kategoryzacji dla podanego tekstu **bez zapisywania
        zgłoszenia**. Służy do prezentacji i testowania modułu.

        Wystarczy podać `title` **lub** `description`.

        Gdy tekst pasuje do kilku słów kluczowych naraz, wybierane jest
        dopasowanie o najwyższym priorytecie — dzięki temu incydent
        bezpieczeństwa nie zostaje zaklasyfikowany jako rutynowa prośba
        o reset hasła.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, example: Podejrzany e-mail }
                description:
                  type: string
                  example: Prosba o podanie hasla, wyglada na phishing
      responses:
        "200":
          description: Wynik kategoryzacji
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WynikAI" }
        "400":
          $ref: "#/components/responses/BledneDane"
        "401":
          $ref: "#/components/responses/BrakAutoryzacji"
        "413":
          $ref: "#/components/responses/ZaDuzeZadanie"

# ===============================================================
components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token JWT (HS256) zwrócony przez `POST /auth/login`, ważny 8 godzin.

  parameters:
    TicketId:
      name: ticket_id
      in: path
      required: true
      description: Identyfikator zgłoszenia
      schema: { type: integer, example: 12 }

  schemas:

    Rola:
      type: string
      enum: [pracownik, technik, admin]

    Status:
      type: string
      enum: [Nowe, W trakcie, Wstrzymane, Rozwiazane, Zamkniete]

    Priorytet:
      type: string
      description: Wyznacza termin SLA — Krytyczny 1 h, Wysoki 4 h, Sredni 8 h, Niski 24 h.
      enum: [Niski, Sredni, Wysoki, Krytyczny]

    Kategoria:
      type: string
      enum:
        - Sprzet
        - Oprogramowanie
        - Siec
        - Poczta
        - Konta i dostep
        - Bezpieczenstwo
        - Peryferia

    WynikAI:
      type: object
      required: [kategoria, priorytet, pewnosc, wymaga_weryfikacji, dopasowania]
      properties:
        kategoria: { $ref: "#/components/schemas/Kategoria" }
        priorytet: { $ref: "#/components/schemas/Priorytet" }
        pewnosc:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: |
            Siła przesłanek stojących za decyzją. Zależy od tego, jak bardzo
            zwycięska kategoria dominuje nad pozostałymi oraz ile niezależnych
            słów ją wskazuje. Wartość `0.0` oznacza brak jakichkolwiek
            przesłanek — moduł nie rozpoznał zgłoszenia.
          example: 0.75
        wymaga_weryfikacji:
          type: boolean
          description: |
            `true`, gdy pewność jest poniżej progu (0.4). Zgłoszenie powinno
            zostać sprawdzone przez technika — moduł nie zgaduje po cichu.
          example: false
        dopasowania:
          type: array
          description: |
            Słowa kluczowe, które zadecydowały o kategorii — uzasadnienie
            decyzji dla technika.
          items: { type: string }
          example: ["vpn", "polaczen"]

    Klient:
      type: object
      required: [id, name, pracownikow, zgloszen, otwartych]
      properties:
        id: { type: integer, example: 2 }
        name: { type: string, example: Biuro Rachunkowe Bilans }
        pracownikow:
          type: integer
          description: Liczba kont pracowników tej firmy
          example: 1
        zgloszen:
          type: integer
          description: Wszystkie zgłoszenia klienta
          example: 6
        otwartych:
          type: integer
          description: Zgłoszenia o statusie innym niż `Zamkniete`
          example: 4

    Raport:
      type: object
      required: [klient, okres, podsumowanie, poprzedni_okres, wg_kategorii,
                 wg_priorytetu, trend, najczestsze_problemy, rekomendacje]
      properties:
        klient:
          type: object
          nullable: true
          description: "`null` w raporcie zbiorczym wszystkich klientów"
          required: [id, name]
          properties:
            id: { type: integer, example: 4 }
            name: { type: string, example: Hurtownia Budowlana Cegiełka }
        okres:
          type: object
          required: [od, do, dni, grupowanie]
          properties:
            od: { type: string, format: date, example: "2026-09-07" }
            do: { type: string, format: date, example: "2026-10-06" }
            dni: { type: integer, example: 30 }
            grupowanie:
              type: string
              enum: [dzien, tydzien, miesiac]
              description: |
                Szerokość przedziałów trendu: do 31 dni — dni, do 183 dni —
                tygodnie (od pierwszego dnia okresu), dłużej — miesiące.
        podsumowanie:
          type: object
          required: [zgloszen, otwartych, rozwiazanych, procent_rozwiazanych,
                     krytycznych, sredni_czas_rozwiazania_h, rozwiazanych_z_terminem,
                     w_terminie_sla, procent_w_terminie_sla, otwartych_po_terminie]
          properties:
            zgloszen: { type: integer, example: 12 }
            otwartych: { type: integer, example: 3 }
            rozwiazanych: { type: integer, example: 9 }
            procent_rozwiazanych: { type: number, nullable: true, example: 75.0 }
            krytycznych: { type: integer, example: 2 }
            sredni_czas_rozwiazania_h: { type: number, nullable: true, example: 5.4 }
            rozwiazanych_z_terminem:
              type: integer
              description: Rozwiązane zgłoszenia, które miały termin SLA
              example: 9
            w_terminie_sla: { type: integer, example: 7 }
            procent_w_terminie_sla: { type: number, nullable: true, example: 77.8 }
            otwartych_po_terminie:
              type: integer
              description: Otwarte zgłoszenia, których termin SLA już minął
              example: 1
        poprzedni_okres:
          type: object
          required: [od, do, zgloszen, zmiana_proc]
          properties:
            od: { type: string, format: date, example: "2026-08-08" }
            do: { type: string, format: date, example: "2026-09-06" }
            zgloszen: { type: integer, example: 8 }
            zmiana_proc:
              type: number
              nullable: true
              description: "`null`, gdy w poprzednim okresie nie było zgłoszeń"
              example: 50.0
        wg_kategorii:
          type: array
          description: Od najczęstszej; także kategorie obecne tylko w poprzednim okresie
          items:
            type: object
            required: [kategoria, etykieta, liczba, poprzednio, zmiana_proc]
            properties:
              kategoria:
                allOf: [{ $ref: "#/components/schemas/Kategoria" }]
                nullable: true
              etykieta:
                type: string
                description: Nazwa do wyświetlenia klientowi (z polskimi znakami)
                example: Sieć
              liczba: { type: integer, example: 5 }
              poprzednio: { type: integer, example: 2 }
              zmiana_proc: { type: number, nullable: true, example: 150.0 }
        wg_priorytetu:
          type: array
          description: Wszystkie priorytety od najpoważniejszego, także z zerem
          items:
            type: object
            required: [priorytet, liczba]
            properties:
              priorytet:
                allOf: [{ $ref: "#/components/schemas/Priorytet" }]
                nullable: true
              liczba: { type: integer, example: 2 }
        trend:
          type: array
          description: Liczba zgłoszeń w kolejnych przedziałach — także zerowych
          items:
            type: object
            required: [okres, liczba]
            properties:
              okres:
                type: string
                description: Początek przedziału (`RRRR-MM-DD`) albo miesiąc (`RRRR-MM`)
                example: "2026-09-07"
              liczba: { type: integer, example: 1 }
        najczestsze_problemy:
          type: array
          description: |
            Do pięciu problemów wskazanych przez słowa kluczowe modułu AI,
            w czytelnej formie (rdzeń `drukark` → „drukarka"). Rdzenie tego
            samego problemu są scalane, a zgłoszenie liczy się raz.
          items:
            type: object
            required: [problem, liczba]
            properties:
              problem: { type: string, example: drukarka }
              liczba: { type: integer, description: Liczba zgłoszeń, example: 4 }
        rekomendacje:
          type: array
          items: { type: string }
          example:
            - "50% zgłoszeń dotyczy kategorii Sieć — to główne źródło problemów w tym okresie."

    Zgloszenie:
      type: object
      required:
        - id
        - title
        - description
        - category
        - priority
        - status
        - created_by
        - assigned_to
        - ai_categorized
        - ai_pewnosc
        - sla_deadline
        - created_at
        - updated_at
        - closed_at
        - created_by_name
        - assigned_to_name
        - client_id
        - client_name
      properties:
        id: { type: integer, example: 12 }
        title: { type: string, example: Nie dziala VPN }
        description: { type: string, example: Blad TLS handshake }
        category:
          allOf: [{ $ref: "#/components/schemas/Kategoria" }]
          nullable: true
        priority:
          allOf: [{ $ref: "#/components/schemas/Priorytet" }]
          nullable: true
        status: { $ref: "#/components/schemas/Status" }
        created_by:
          type: integer
          description: Identyfikator zgłaszającego
          example: 1
        assigned_to:
          type: integer
          nullable: true
          description: Identyfikator przypisanego technika
          example: 4
        created_by_name:
          type: string
          nullable: true
          description: Imię i nazwisko zgłaszającego (dołączane przez serwer)
          example: Katarzyna Nowak
        assigned_to_name:
          type: string
          nullable: true
          description: Imię i nazwisko przypisanego technika
          example: Marek Lewandowski
        client_id:
          type: integer
          nullable: true
          description: |
            Klient (firma) zgłaszającego w chwili utworzenia zgłoszenia.
            Nie zmienia się, gdy pracownik przejdzie później do innej firmy.
          example: 2
        client_name:
          type: string
          nullable: true
          description: Nazwa klienta (dołączana przez serwer)
          example: Biuro Rachunkowe Bilans
        ai_categorized:
          type: boolean
          description: Czy kategorię nadał moduł AI
          example: true
        ai_pewnosc:
          type: number
          format: float
          nullable: true
          minimum: 0
          maximum: 1
          description: |
            Pewność modułu AI zapisana w chwili tworzenia zgłoszenia.
            Pozwala technikowi odróżnić decyzje pewne od zgadywanych.
            `null` dla zgłoszeń sprzed wprowadzenia tego pola.
          example: 0.75
        sla_deadline:
          type: string
          format: date-time
          nullable: true
          example: "2026-08-01T15:30:00Z"
        created_at: { type: string, format: date-time, example: "2026-07-25T11:40:00Z" }
        updated_at: { type: string, format: date-time, example: "2026-07-25T12:05:00Z" }
        closed_at:
          type: string
          format: date-time
          nullable: true
          example: null

    Notatka:
      type: object
      required: [author, content, internal, created_at]
      properties:
        author: { type: string, example: Marek Lewandowski }
        content: { type: string, example: Certyfikat VPN wygasl. Odnawiam. }
        internal:
          type: boolean
          description: Notatki wewnętrzne nie są zwracane pracownikowi
          example: true
        created_at: { type: string, format: date-time }

    WpisAudytu:
      type: object
      required: [action, user, old, new, timestamp]
      properties:
        action:
          type: string
          example: Zmiana statusu
        user:
          type: string
          description: Osoba wykonująca zmianę lub `System AI` dla działań automatycznych
          example: Marek Lewandowski
        old: { type: string, nullable: true, example: Nowe }
        new: { type: string, nullable: true, example: W trakcie }
        timestamp: { type: string, format: date-time }

    Blad:
      type: object
      required: [error]
      properties:
        error: { type: string }

  responses:

    BledneDane:
      description: |
        Nieprawidłowe lub niekompletne dane wejściowe — brak wymaganego pola,
        przekroczona długość albo **nieprawidłowy typ** (pole tekstowe musi być
        tekstem; liczba lub obiekt kończą się kodem 400, nie 500).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Blad" }
          examples:
            brak_pola:
              summary: Brak wymaganego pola
              value: { error: "Pole 'title' jest wymagane" }
            zly_typ:
              summary: Nieprawidłowy typ
              value: { error: "Pole 'title' musi byc tekstem" }
            za_dlugie:
              summary: Przekroczona długość
              value: { error: "Pole 'title' jest za dlugie (max 200 znakow)" }

    BledneDaneLogowania:
      description: Nieprawidłowy login lub hasło
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Blad" }
          example: { error: "Nieprawidlowy login lub haslo" }

    BrakAutoryzacji:
      description: Brak tokenu, token wygasły lub nieprawidłowy
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Blad" }
          example: { error: "Wymagana autoryzacja" }

    BrakUprawnien:
      description: Rola użytkownika nie pozwala na tę operację
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Blad" }
          example: { error: "Brak uprawnien dla tej operacji" }

    BrakDostepuDoZgloszenia:
      description: Pracownik próbuje odczytać cudze zgłoszenie
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Blad" }
          example: { error: "Brak dostepu do tego zgloszenia" }

    NieZnaleziono:
      description: Zasób o podanym identyfikatorze nie istnieje
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Blad" }
          example: { error: "Nie znaleziono zgloszenia" }

    ZaDuzeZadanie:
      description: Ciało żądania przekracza 64 KB — odrzucone przed parsowaniem
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Blad" }
          example: { error: "Zadanie jest za duze" }

    ZaWieleZadan:
      description: Przekroczono limit prób logowania (10/min, 30/h)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Blad" }
