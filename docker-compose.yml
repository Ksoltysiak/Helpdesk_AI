# Domyślny sterownik logów (json-file) nie ma limitu rozmiaru i z czasem
# potrafi zapełnić dysk serwera. 3 pliki po 10 MB na usługę.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  helpdesk:
    build: .
    # Port NIE jest publikowany na host — ruch wchodzi wyłącznie przez nginx.
    # Aplikacja jest osiągalna tylko w sieci wewnętrznej compose.
    expose:
      - "5000"
    volumes:
      - helpdesk-data:/app/data
    environment:
      - DB_PATH=/app/data/helpdesk.db
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY env var before starting}
      # Aplikacja stoi za nginx, więc prawdziwy adres klienta jest
      # w X-Forwarded-For. Bez tego wszyscy dzielą jeden licznik limitu.
      - TRUST_PROXY=1
      # Opcjonalne — opis w .env.example. Puste = wyłączone.
      - FORCE_HTTPS=${FORCE_HTTPS:-}
      - RATELIMIT_STORAGE_URI=${RATELIMIT_STORAGE_URI:-}
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=3).status==200 else sys.exit(1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    # Docker po SIGTERM czeka domyślnie 10 s, a gunicorn daje procesom
    # roboczym 30 s na dokończenie żądań. Bez tego zatrzymanie mogłoby
    # przerwać żądania w trakcie obsługi.
    stop_grace_period: 30s
    # Aplikacja działa jako zwykły użytkownik na porcie powyżej 1024, więc
    # nie potrzebuje żadnych uprawnień jądra (capabilities). Zakaz
    # podnoszenia uprawnień blokuje np. programy z bitem setuid.
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *logging

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      helpdesk:
        condition: service_healthy
    restart: unless-stopped
    # Proces główny nginx startuje jako root, otwiera port 80 i przełącza
    # procesy robocze na użytkownika nginx. Zostawiamy tylko te uprawnienia.
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    logging: *logging

  # Cykliczne kopie zapasowe bazy (opis: BACKUP.md).
  backup:
    build: ./deploy/backup
    volumes:
      - helpdesk-data:/data
      # Domyślnie wolumen Dockera; BACKUP_HOST_DIR=/sciezka zapisuje kopie
      # w katalogu hosta, skąd łatwo przenieść je poza serwer.
      - ${BACKUP_HOST_DIR:-helpdesk-backups}:/backups
    environment:
      - DB_PATH=/data/helpdesk.db
      - BACKUP_SCHEDULE=${BACKUP_SCHEDULE:-0 2 * * *}
      - BACKUP_KEEP=${BACKUP_KEEP:-14}
      - TZ=${TZ:-Europe/Warsaw}
    depends_on:
      helpdesk:
        condition: service_healthy
    restart: unless-stopped
    # Bez cap_drop: skrypty startują jako root, ustawiają właściciela katalogu
    # kopii i przełączają się (su-exec) na właściciela bazy.
    security_opt: [no-new-privileges:true]
    logging: *logging

volumes:
  helpdesk-data:
  helpdesk-backups:
