[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
pythonpath = backend
addopts = -q --strict-markers
markers =
    unit: testy jednostkowe — czysta logika, bez I/O
    integration: testy integracyjne — pelny stos Flask + baza danych
filterwarnings =
    # W testach magazyn w pamieci jest wlasciwym wyborem — ostrzezenie
    # dotyczy wylacznie uruchomien produkcyjnych.
    ignore:Using the in-memory storage:UserWarning
