<!DOCTYPE html>
<html lang="pl" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HelpDesk IT</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@0.378.0/dist/umd/lucide.min.js"></script>
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <div class="login-logo">
      <div class="login-logo-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      </div>
      <div>
        <h1>HelpDesk IT</h1>
      </div>
    </div>
    <p class="login-subtitle">System zarządzania zgłoszeniami IT</p>
    
    <div class="role-cards" id="roleCards">
      <div class="role-card selected" data-role="pracownik" onclick="selectRole('pracownik')">
        <div class="role-card-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </div>
        <div class="role-card-title">Pracownik</div>
        <div class="role-card-desc">Zgłaszaj problemy IT</div>
      </div>
      <div class="role-card" data-role="technik" onclick="selectRole('technik')">
        <div class="role-card-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
        </div>
        <div class="role-card-title">Technik IT</div>
        <div class="role-card-desc">Zarządzaj zgłoszeniami</div>
      </div>
    </div>

    <div class="form-field">
      <label class="form-label" for="loginName">Imię i nazwisko</label>
      <input class="form-input" type="text" id="loginName" placeholder="Wpisz swoje imię...">
    </div>

    <button class="btn btn-primary btn-full" onclick="doLogin()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
      Zaloguj się
    </button>
  </div>
</div>

<div class="app" id="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo-icon">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      </div>
      <div>
        <div class="sidebar-logo-text">HelpDesk IT</div>
        <div class="sidebar-logo-sub" id="sidebarRoleLabel">Portal Pracownika</div>
      </div>
    </div>
    <nav class="sidebar-nav" id="sidebarNav">
    </nav>
    <div class="sidebar-footer">
      <div class="user-card">
        <div class="user-avatar" id="userAvatarSidebar">AK</div>
        <div>
          <div class="user-name" id="userNameSidebar">Anna Kowalska</div>
          <div class="user-role" id="userRoleSidebar">Pracownik</div>
        </div>
      </div>
    </div>
  </aside>

  <div class="main-wrap">
    <header class="main-header">
      <div class="main-header-title" id="pageTitle">Dashboard</div>
      <div class="header-actions">
        <button class="icon-btn" onclick="toggleTheme()" id="themeToggle" aria-label="Przełącz motyw">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
        <button class="icon-btn" aria-label="Powiadomienia">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          <span class="notif-dot" id="notifDot"></span>
        </button>
        <button class="btn btn-sm btn-secondary" onclick="doLogout()">Wyloguj</button>
      </div>
    </header>

    <main class="main-content" id="mainContent">
    </main>
  </div>
</div>

<div class="modal-overlay" id="ticketModal">
  <div class="modal" id="ticketModalContent">
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
