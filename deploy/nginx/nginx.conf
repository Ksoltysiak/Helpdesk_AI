# Odwrotne proxy przed aplikacją.
#
# Po co osobna warstwa, skoro gunicorn sam obsługuje HTTP:
#
#   * bufuje wolnych klientów — bez tego jeden klient wysyłający żądanie
#     bajt po bajcie zajmuje workera gunicorna na cały czas transmisji,
#   * jest miejscem na terminację TLS przy wdrożeniu produkcyjnym,
#   * ogranicza rozmiar żądania i czas połączenia zanim dotrą do aplikacji,
#   * daje jeden punkt wejścia, gdy dojdą kolejne usługi.

upstream helpdesk {
    server helpdesk:5000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Górny limit rozmiaru żądania. Największe pole to opis zgłoszenia
    # (5000 znaków), więc 1 MB zostawia duży zapas, a odcina próby
    # wysłania wielomegabajtowych ładunków.
    client_max_body_size 1m;
    client_body_timeout  15s;
    client_header_timeout 15s;

    # Nie ujawniamy wersji serwera w nagłówku Server ani na stronach błędów.
    server_tokens off;

    # Kompresję wykonuje aplikacja (zna typy odpowiedzi i próg opłacalności).
    # Podwójne pakowanie tylko kosztowałoby CPU.
    gzip off;

    # Nagłówki bezpieczeństwa ustawia aplikacja — jedno źródło prawdy.
    # Nginx ich nie dubluje, żeby nie powstały dwie rozjeżdżające się polityki.

    location / {
        proxy_pass http://helpdesk;
        proxy_http_version 1.1;

        # Bez tych nagłówków aplikacja widzi adres proxy zamiast klienta,
        # a wtedy wszyscy użytkownicy dzielą jeden licznik limitu logowania.
        # Po stronie aplikacji trzeba włączyć TRUST_PROXY=1.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 5s;
        proxy_send_timeout   30s;
        proxy_read_timeout   30s;
    }

    # Kontrola zdrowia nie musi trafiać do logów dostępu — sonda odpytuje
    # ją stale i zaśmiecałaby zapis.
    location /api/health {
        access_log off;
        proxy_pass http://helpdesk;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
