# Wariant nginx z terminacją TLS.
#
# Włączany nakładką docker-compose.https.yml (make up-https). Domyślny stos
# i CI używają nginx.conf po samym HTTP, więc brak certyfikatu nie blokuje
# nikomu uruchomienia projektu.
#
# Certyfikat kończy się na nginx; aplikacja dostaje zwykły HTTP i nagłówek
# X-Forwarded-Proto: https, który czyta dzięki TRUST_PROXY=1. Dzięki temu
# request.is_secure jest prawdziwe, a FORCE_HTTPS wysyła HSTS.
#
# Pozostałe ustawienia (limity, timeouty, brak gzip, brak nagłówków
# bezpieczeństwa) są celowo takie same jak w nginx.conf — uzasadnienie tam.

upstream helpdesk {
    server helpdesk:5000;
    keepalive 32;
}

# HTTP służy wyłącznie do przekierowania na HTTPS.
server {
    listen 80;
    server_name _;
    server_tokens off;

    # Port 8443 to port HTTPS publikowany na host w docker-compose.https.yml.
    # $host nie zawiera portu, więc trzeba go podać jawnie.
    return 301 https://$host:8443$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    # Wyłącznie TLS 1.2 i 1.3 — starsze wersje mają znane słabości
    # (POODLE, BEAST) i są wycofane (RFC 8996).
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 1m;
    client_body_timeout  15s;
    client_header_timeout 15s;

    server_tokens off;
    gzip off;

    location / {
        proxy_pass http://helpdesk;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 5s;
        proxy_send_timeout   30s;
        proxy_read_timeout   30s;
    }

    location /api/health {
        access_log off;
        proxy_pass http://helpdesk;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
