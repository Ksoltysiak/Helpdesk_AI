name: Testy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  testy:
    name: Testy jednostkowe, integracyjne i E2E
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalacja zaleznosci
        run: pip install -r requirements-dev.txt

      # Warstwy 1 i 2 piramidy — bez uruchamiania serwera.
      - name: Testy jednostkowe i integracyjne
        env:
          SECRET_KEY: klucz-tylko-do-testow-ci-o-dlugosci-32-bajtow
        run: pytest --cov --cov-report=term-missing

      # Warstwa 3 — pelny przeplyw przez dzialajacy serwer.
      - name: Testy E2E przy dzialajacym serwerze
        env:
          SECRET_KEY: klucz-tylko-do-testow-ci-o-dlugosci-32-bajtow
          DB_PATH: /tmp/ci-helpdesk.db
        run: |
          python seed.py
          gunicorn --bind 127.0.0.1:5000 wsgi:app --daemon
          for _ in $(seq 30); do
            curl -sf http://127.0.0.1:5000/api/health >/dev/null && break
            sleep 1
          done
          python demo.py

  bezpieczenstwo-zaleznosci:
    name: Skanowanie zaleznosci
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Sprawdza zainstalowane pakiety wzgledem bazy podatnosci PyPI.
      - name: Znane podatnosci w zaleznosciach (pip-audit)
        run: |
          pip install pip-audit
          pip install -r requirements.txt
          pip-audit --strict --desc

  stos-docker:
    name: Pelny stos (nginx + aplikacja)
    runs-on: ubuntu-latest

    # SECRET_KEY musi obowiazywac w CALYM zadaniu, nie tylko przy starcie.
    # docker-compose.yml celowo wymaga tej zmiennej (${SECRET_KEY:?...}), wiec
    # bez niej KAZDE kolejne polecenie compose — exec, logs, down — konczy sie
    # bledem interpolacji, nawet jesli stos juz dziala.
    env:
      SECRET_KEY: klucz-tylko-do-testow-ci-o-dlugosci-32-bajtow

    steps:
      - uses: actions/checkout@v4

      # Sprawdzamy caly stos z docker compose, a nie sam obraz aplikacji:
      # blad w konfiguracji nginx albo w polaczeniu miedzy uslugami nie
      # ujawnilby sie przy uruchomieniu samego kontenera aplikacji.
      - name: Uruchomienie stosu
        run: docker compose up -d --build

      - name: Czekanie na gotowosc przez nginx
        run: |
          for _ in $(seq 60); do
            curl -sf http://127.0.0.1:8080/api/health >/dev/null && break
            sleep 2
          done
          curl -sf http://127.0.0.1:8080/api/health | grep -q '"ok"'

      - name: Aplikacja nie dziala jako root
        run: docker compose exec -T helpdesk whoami | grep -qx app

      - name: Dokumentacja API jest czescia obrazu
        run: |
          curl -sf http://127.0.0.1:8080/api/openapi.yaml | grep -q "openapi:"
          curl -sf http://127.0.0.1:8080/api/docs/ >/dev/null

      - name: Nginx przekazuje adres klienta (X-Forwarded-For)
        run: |
          # Aplikacja za proxy musi widziec adres klienta, inaczej wszyscy
          # uzytkownicy dziela jeden licznik limitu logowania.
          docker compose exec -T helpdesk python -c "from app import config; assert config.TRUST_PROXY, 'TRUST_PROXY wylaczone za proxy'"

      - name: Frontend jest serwowany przez nginx
        run: curl -sf http://127.0.0.1:8080/ | grep -q "HelpDesk"

      - name: Logi przy niepowodzeniu
        if: failure()
        run: docker compose logs --tail 60

      - name: Sprzatanie
        if: always()
        run: docker compose down -v

  publikacja-obrazu:
    name: Publikacja obrazu (CD)
    runs-on: ubuntu-latest
    # Publikujemy dopiero, gdy wszystko powyzej przeszlo, i wylacznie
    # z galezi main — pull requesty buduja obraz, ale go nie publikuja.
    needs: [testy, bezpieczenstwo-zaleznosci, stos-docker]
    #
    # Krok jest OPCJONALNY i wlaczany zmienna repozytorium PUBLIKUJ_OBRAZ.
    # Powod: zapis do rejestru GHCR wymaga uprawnien, ktorych nie da sie nadac
    # z poziomu kodu — w ustawieniach repozytorium trzeba wlaczyc
    # Settings -> Actions -> General -> Workflow permissions -> Read and write.
    # Bez tego zadanie konczy sie bledem i psuje wynik calego przebiegu, mimo
    # ze aplikacja jest sprawna. Instrukcja wlaczenia: ARCHITECTURE.md.
    if: >-
      github.ref == 'refs/heads/main'
      && github.event_name == 'push'
      && vars.PUBLIKUJ_OBRAZ == 'true'

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Logowanie do rejestru GitHuba
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Budowa i publikacja
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Znacznik z SHA pozwala wdrozyc dokladnie ten commit i wrocic
          # do poprzedniego, gdy cos pojdzie nie tak.
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
