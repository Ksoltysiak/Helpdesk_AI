name: Helpdesk AI CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Run Linter & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Verify Python syntax
        run: |
          python -m compileall backend/ scripts/

      - name: Initialize Database
        run: |
          python backend/seed.py

      - name: Start Application Server
        env:
          SECRET_KEY: "ci-secret-key-testing-only"
        run: |
          python backend/app.py &
          sleep 3

      - name: Execute REST API Demo Integration Tests
        run: |
          python scripts/demo.py

  docker-build:
    name: Validate Docker Build & Compose Architecture
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create .env file for Compose
        run: |
          echo "SECRET_KEY=ci-pipeline-docker-secret-key-12345" > .env

      - name: Build Docker Services
        run: |
          docker compose build
